<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrilift — Training &amp; Stack Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-top">
    <div class="wordmark"><span class="mark"></span>NUTRILIFT<span class="dot">.</span></div>
    <button id="themeToggle" class="mode-switch" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">DARK</span>
    </button>
  </div>
  <div class="masthead-bottom">
    <span class="tagline">TRAINING &amp; STACK LOG</span>
    <span class="divider">•</span>
    <span class="date-badge mono" id="dateBadge">TUE · AUG 04</span>
    <span class="divider">•</span>
    <span class="streak">STREAK <strong class="mono" id="streakCount">6</strong> DAYS</span>
  </div>
</header>
